syntax = "proto3";

package ticket;
option go_package = "github.com/dwikikusuma/ticket-rush/common/gen/ticket/v1;ticketv1";

message TicketRequest {
  int32 event_id = 1;
}

message TicketResponse {
  int32 ticket_id = 1;
  string event_name = 2;
  string stadium = 3;
  int64 price = 4;
  string seat_id = 5;
  string status = 6;
}

service TicketService {
  rpc GetTicket (TicketRequest) returns (TicketResponse);
}