global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['host.docker.internal:8087']

  - job_name: 'booking-service'
    static_configs:
      - targets: ['host.docker.internal:8086']

  - job_name: 'fulfillment-service'
    static_configs:
      - targets: ['host.docker.internal:9091']